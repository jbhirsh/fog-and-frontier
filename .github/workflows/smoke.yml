name: Smoke gate

# Runs when Vercel reports a deployment (deployment_status), for each PR's
# preview and for production after each merge, and runs canary checks
# against it. Vercel says when the deployment is ready, so nothing here
# polls for it (jbhirsh/ci#58). `smoke` is a required check.
#
# Only a successful deployment is tested. Any other state (pending,
# failure, error) skips the job, and a skipped check passes, so that run
# is named "smoke (not deployed)" and never stands in for the required
# `smoke`. A deploy that fails is reported by the required Vercel check.
# A commit Vercel doesn't deploy at all gets no `smoke`, and its PR waits:
# deploy it, as nothing here skips a build today.
#
# The run checks out the deployment's commit, so a PR's own scripts/smoke.mjs
# tests its own preview, with this repository's secrets (the bypass secret,
# VERCEL_TOKEN). Vercel deploys a fork's PR only once the owner authorizes it,
# and authorizing one hands that fork's code these secrets.
on:
  deployment_status:

jobs:
  smoke:
    name: ${{ github.event.deployment_status.state == 'success' && 'smoke' || 'smoke (not deployed)' }}
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Only ever send the bypass secret over https to a Vercel host: a
      # deployment_status pointing elsewhere is refused. Node parses the URL
      # as fetch will, so `?`, `#` or `\` can't hide another host.
      - name: Read the deployment
        id: ctx
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
        run: |
          node -e '
            let u;
            try { u = new URL(process.env.URL); } catch { u = null; }
            if (!u || u.protocol !== "https:" || !u.hostname.endsWith(".vercel.app")) {
              console.log(`::error::refusing to smoke-test unexpected URL: ${process.env.URL}`);
              process.exit(1);
            }'
          case "$ENVIRONMENT" in
            Production) env=Production ;;
            *) env=Preview ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "env=$env" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Vercel sometimes reports a deployment as success while serving a
      # "Builds: [0ms]" no-build cached preview: no API routes, no built CSS.
      # The smoke script exits 2 on that signature, and the gate fails at
      # once, saying what to do: a stub doesn't turn into a build by waiting.
      - name: Smoke gate (with no-build-stub detection)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ steps.ctx.outputs.url }}
          SMOKE_ENV: ${{ steps.ctx.outputs.env }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          node scripts/smoke.mjs "$PREVIEW_URL"
          code=$?
          case "$code" in
            0) echo "Smoke gate passed." ;;
            1) echo "::error::Smoke gate detected a regression: the preview is built but one or more canary checks failed. See log above." ;;
            2) echo "::error::Vercel served a no-build cached preview for $SHA though it reported success: it has no /assets/*.css link and 404s the API routes. Investigate the Vercel project's Ignored Build Step and Root Directory settings, or start a fresh deploy (vercel --force, or redeploy in Vercel's dashboard)." ;;
            *) echo "::error::Smoke script exited with unexpected code $code" ;;
          esac
          exit "$code"

      # Best-effort diagnostic. Only runs if VERCEL_TOKEN is configured and
      # only on failure of the smoke step above. Helps tell apart "Vercel
      # really did skip the build" from "real build but our checks broke."
      - name: Inspect Vercel deployment (best-effort)
        if: failure() && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.ctx.outputs.url }}
        run: |
          set +e
          npm install -g vercel@latest >/dev/null 2>&1
          echo "::group::vercel inspect $PREVIEW_URL"
          vercel inspect "$PREVIEW_URL" --token="$VERCEL_TOKEN" || true
          echo "::endgroup::"
