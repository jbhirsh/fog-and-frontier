name: Claude Review

# AI code review on every PR to main: jbhirsh/ci's review action
# (review/action.yml there says what it does, and what it leaves to this
# repo's other checks). This repo's part is in .github/ci.json ("review")
# and the guide it names, .github/claude-review.md, both read from main.
#
# Its own workflow, not a job in ci.yml: claude-code-action skips (and still
# reports success on) a PR that edits the workflow file it runs from, so only
# a PR that edits this stub goes unreviewed. It doesn't wait for CI, so a red
# PR is reviewed too. claude-autofix.yml reacts to this workflow's completion
# by `name:`, and the job's `name:` is a required status check, so keep both.
on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Run the JavaScript actions (claude-code-action et al.) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Two passes over a big PR take minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token for the Claude app's token.
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
