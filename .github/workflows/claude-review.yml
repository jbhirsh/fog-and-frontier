name: Claude Review

# AI code review on every PR to main. It is its own workflow, not a job in
# ci.yml, because claude-code-action skips (and still reports success on) a PR
# that edits the workflow file it runs from: as a job in ci.yml it silently
# skipped every PR that touched CI. Now only a PR that edits this file goes
# unreviewed. It no longer waits for CI, so a red PR is reviewed too.
# claude-autofix.yml reacts to this workflow's completion by `name:`, and the
# job's `name:` is a required status check, so keep both in step.
on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Run GitHub's bundled JavaScript actions (claude-code-action et al.) on the
  # Node 24 runtime instead of the deprecated default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default; the review job widens its own scope where it
# genuinely needs pull-requests/issues write.
permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let the AI review run on Dependabot's dependency-bump PRs. Without
          # this, claude-code-action refuses to run for the bot actor and fails
          # with "Workflow initiated by non-human actor: dependabot (type: Bot)".
          # Allow-list only this one trusted bot rather than "*".
          # claude[bot] pushes autofix's commits; without it the review
          # fails on them and, being required, blocks the PR.
          allowed_bots: "dependabot[bot],claude[bot]"
          prompt: |
            Review this pull request for correctness, bugs, and adherence to
            the project's engineering conventions. This is "Fog and Frontier",
            a personal West Coast adventures app: Vite + React 19 + TypeScript
            on the front end, a single Vercel serverless function in `api/`
            (`api/graphql.ts` — an Apollo Server on Express, schema in
            `api/_schema.ts`, resolvers in `api/_resolvers/*`), Turso (libSQL)
            for persistence, and Clerk for auth.

            ## Code review focus

            Flag issues in these areas:
              - Logic errors and edge cases in resolvers, reducers, and pure
                utilities.
              - Type safety and null/undefined handling (strict TypeScript).
              - React pitfalls (stale closures, effect deps, unnecessary
                re-renders, missing keys).
              - GraphQL: resolvers that don't match `api/_schema.ts`.
              - Accessibility regressions in new UI.

            ## Engineering conventions to enforce

            Treat violations of these as review issues and flag them inline:

            **Auth model (critical — get this right):**
              - The server gates are in `api/_gqlContext.ts`. Any mutating
                resolver or paid/external call (e.g. Gemini) MUST be guarded
                server-side by `requireOwnerCtx` (or `requireMemberCtx` /
                `requireCreatorCtx` for trip-scoped actions, or
                `requireUserCtx` where something else authorizes the write,
                e.g. `claimInvite`'s invite token). `useOwner()` in
                `src/lib/useOwner.ts` is a UI hint ONLY — never the real
                authorization. Flag any mutating resolver path that reaches a
                write or paid call without one of these guards, and flag any
                code that treats the client-side owner check as if it were
                enforcement.

            **Role-gated UI (hide, don't grey out):**
              - Owner-guarded *mutating* controls (add / edit / delete / other
                writes) must be **hidden** from non-owners — gate the JSX on
                `isOwner` (e.g. `{isOwner && <button …/>}`). Flag any
                owner-gated write control rendered as `disabled={!isOwner}` or
                with a "Sign in to edit"-style tooltip; that convention was
                deliberately reversed (hide, don't grey).
              - *Reads* stay visible to everyone; only the write affordance
                inside them is hidden.
              - Do NOT flag sign-in-gated CTAs (any-visitor "Sign in to…"
                prompts) or trip-creator-gated controls — those are different
                gates and keep their existing disabled+tooltip presentation.

            **Testing:**
              - Every new resolver, reducer, or pure util must have a unit test
                (Vitest + RTL). Flag any new resolver / reducer / utility
                without a corresponding test.
              - Tests must be pure logic or RTL — no real network, DB, or
                browser. Flag tests that hit a live service.
              - A multi-write DB path must be a single batched write; the test
                should assert one `db().batch(stmts, 'write')` (see
                `transitionToPast` / `createTrip` / `patchTrip`). Flag
                multi-write resolvers that issue separate writes instead of one
                batch, or that lack the single-batch assertion.
              - NEVER modify a test to make it pass — the fix belongs in the
                implementation. If a PR changes an assertion to match new
                (possibly-wrong) behavior instead of fixing the code, flag it.

            **TypeScript / ESLint:**
              - All new code must be typed (strict mode).
              - A lint rule may only be relaxed by a narrow, file-scoped
                override in `eslint.config.js` with a comment saying why.
                Flag a rule turned off or downgraded globally.

            **Commit hygiene (inspect `git log` on the PR branch):**
              - CI's commit-message check (`.github/scripts/check-commits.sh`)
                already fails on subject length, a missing body, fixup or
                "oops" commits and merge commits; don't repeat those.
              - Each subject should be imperative ("Add X", not "Added X"),
                and the body should explain *why*, not *what*.
              - Commits authored with Claude should end with a
                `Co-Authored-By:` trailer.
              - A commit that patches an earlier commit on the branch (a
                debugging trail) should be squashed into it, whatever its
                subject says. CI/infra/workflow fixes are exempt.

            **Scope:**
              - The PR should do one thing. Flag unrelated refactors, drive-by
                formatting changes, or new abstractions the task doesn't need.
              - Don't add error handling or fallbacks for scenarios that can't
                happen. Only validate at system boundaries.

            **Security / safety:**
              - Flag use of `git add -A` or `--no-verify` patterns if visible
                in commit messages or scripts.
              - DO NOT flag floating GitHub Action version tags
                (e.g. `@v5`, `@v1`) as a supply-chain risk or suggest pinning
                to commit SHAs. The maintainer has accepted this trade-off and
                prefers automatic patch/minor updates.

            ## Visual evidence

            Read the PR description (`gh pr view <number> --json body`). The
            "PR visuals" check already fails a UI change with no picture at
            all; your job is the judgment it can't make. If the diff changes how
            something on screen moves or responds (a transition or animation,
            drag or gesture handling, something opening, closing or collapsing,
            scroll behavior, or a multi-step flow) and the description has no
            GIF or video (an image ending in `.gif`, a `<video>`, or a
            `github.com/user-attachments/assets/` link), leave an inline comment
            on the main changed line asking for before/after GIFs. Still
            screenshots are enough for changes to how things look.

            ## Beyond the diff

            A change can break code it doesn't touch. When the PR changes a
            function's signature or behavior, a type, an exported constant, an
            API response, a storage key or a route, find every caller and reader
            (Grep the repo) and check each still works. Flag a breakage on the
            changed line and name the file it breaks.

            ## Stored data

            Turso holds live production data. Tables are created in code with
            `CREATE TABLE IF NOT EXISTS` (see `api/_trips.ts`), which does nothing
            to a table that already exists, so a column added to one of those
            statements never reaches production on its own. Flag a schema change
            without a migration that applies it to the existing table, and a
            renamed or removed column or table that existing rows or other readers
            still depend on. Activities are stored as JSON in table `a` (column
            `j`), so renaming or removing an Activity field breaks existing rows
            with no schema change at all; flag that unless loading still accepts
            the old shape. The browser also keeps the user's photos only in
            localStorage (`fogandfrontier.userPhotos.v1`, `src/lib/userPhotos.ts`);
            renaming the key or changing its shape loses them.

            ## New dependencies

            When `package.json` gains a runtime dependency (`dependencies`, not
            `devDependencies`), flag it if existing code, the platform or an
            already-installed package covers the need. This is about whether the
            package is needed at all; known vulnerabilities are checked elsewhere.

            ## Documentation drift

            The docs are the tracked Markdown files that describe the code as it
            is now (`git ls-files '*.md'`): README.md, CLAUDE.md and the like.
            Plans, changelogs and learnings logs record intent or history; leave
            those alone. Read the docs against the diff. A statement the PR makes
            false (a renamed file, function or component; a changed command,
            script, route, env var, default, limit or version; a moved test
            location; an architecture description that no longer holds) is a
            blocking issue:
              - If the PR's diff includes that line of the doc, put the inline
                comment on it with a GitHub suggestion block (a fenced block
                tagged `suggestion`) holding the corrected line(s), so it can be
                applied in one click.
              - Otherwise put the inline comment on the changed code line that
                made the doc wrong. Name the doc file and line, quote the stale
                text, and give the replacement text.
            Something the PR adds that the docs don't mention yet is not drift:
            note it in the top-level summary, not inline.

            ## Output format

            For every issue you find on a specific line, call the
            `mcp__github_inline_comment__create_inline_comment` tool to leave
            an inline comment anchored to that line. Do not summarize findings
            in a single top-level comment — use inline comments so each issue
            is anchored to the relevant code. Only use a top-level summary for
            overall impressions. Skip style nits already enforced by
            ESLint/Prettier. Be concise.

            An inline comment is a merge blocker: Dependabot PRs merge
            automatically only once every review thread is resolved, and on
            them claude-autofix treats each thread as a bug to fix. Keep inline
            comments for problems that must be fixed before merge; put
            non-blocking notes (FYIs, "not a blocker", follow-up ideas) in the
            top-level summary instead.
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
