name: Claude Review

# AI code review on every PR to main: jbhirsh/ci's review action
# (review/action.yml there says what it does, and what it leaves to this
# repo's other checks). This repo's part is in .github/ci.json ("review")
# and the guide it names, .github/claude-review.md, both read from main.
#
# Its own workflow, not a job in ci.yml, so it doesn't wait for CI: a red PR
# is reviewed too. claude-autofix.yml reacts to this workflow's completion
# by `name:`, and the job's `name:` is a required status check, so keep both.
on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Run the JavaScript actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Two passes over a big PR take minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The review signs in to Claude with the job's OIDC token (the
      # federation IDs below).
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          # Signs in by workload identity federation (the Anthropic Console's
          # Workload identity): the job's OIDC token for a short-lived Claude
          # API token, so no secret is stored. These IDs aren't secret.
          anthropic_federation_rule_id: fdrl_01BuwYpezaN3Vw9dbwvdF5JY
          anthropic_organization_id: 22970ab4-b9f2-4f4b-a7d7-d2e0bab4fcac
          anthropic_service_account_id: svac_01UZj2itXNdhewkTjp9Wv6YG
          anthropic_workspace_id: wrkspc_01GbH32ibMELoz7yNtpC8bB6
