# Secret scanning (gitleaks). GitHub-native secret scanning is off for this
# repo, and the wiring here touches real credentials — GEMINI_API_KEY, the
# sign-in secrets (Better Auth's, the OAuth proxy's, Google's), Turso, and
# VERCEL_AUTOMATION_BYPASS_SECRET — so a leaked key needs a sensor
# that fires *before* it settles into main. .gitignore keeps .env.local out of
# the index and the Claude review can flag a committed secret, but both are
# advisory; this job makes a leak a red check instead.
#
# The scan itself (PR range on pull requests, full history on the weekly
# sweep) is jbhirsh/ci's gitleaks action. The full history was verified clean
# when this was added — the only two hits are localStorage key names
# allowlisted in .gitleaks.toml; add a future false positive there rather
# than disabling the job.
name: Gitleaks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: findings surface in the job summary and a results artifact.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: jbhirsh/ci/gitleaks@main
