name: Update visual baselines

# Run by hand, on a branch: rewrites the visual regression's baselines on
# Linux (the machine they must match; visual.yml compares against them)
# and commits them to that branch. jbhirsh/ci's visual-baselines/rewrite
# does it; this app's settings (the folders, and the command that writes
# them) are the `visual-baselines` key of .github/ci.json. The Actions
# token's push does start the PR's workflows, but each waits for a
# maintainer to approve it on the PR, then runs as github-actions[bot].
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Update visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pushes the new baselines to the branch it ran on.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jbhirsh/ci/visual-baselines/rewrite@main
