# One-off (jbhirsh/ci#144, the end-to-end proof on throwaway PR #377), on
# this throwaway branch only, never merged: each push fetches, signed out,
# the user-attachments links listed in ci144-links.txt (id and expected
# sha256 per line) and fails if any doesn't answer 200 with those bytes.
# The session's own network can't reach github.com/user-attachments.
name: ci#144 proof fetch (throwaway)

on:
  push:
    branches: [scratch/ci144-proof-fetch]

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch each link signed out
        run: |
          fail=0
          while read -r id want; do
            [ -z "$id" ] && continue
            code=$(curl -sSL --max-time 60 -o "$RUNNER_TEMP/$id" -w '%{http_code}' "https://github.com/user-attachments/assets/$id")
            got=$(sha256sum "$RUNNER_TEMP/$id" | cut -d' ' -f1)
            if [ "$code" = 200 ] && [ "$got" = "$want" ]; then r=match; else r=MISMATCH; fail=1; fi
            echo "$id http=$code sha256=$got $r"
          done < ci144-links.txt
          exit $fail
