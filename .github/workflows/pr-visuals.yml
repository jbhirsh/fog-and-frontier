name: PR visuals

# jbhirsh/ci's visuals action. With `visuals.sharedTemplate` on in
# .github/ci.json it passes every PR: visual review decides whether a screen
# changed, and Claude Review (claude-review.yml) judges whether a change to
# motion needs a GIF rather than a still. Kept until it retires with the GIF
# move.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

# A new push or edit supersedes the previous run.
concurrency:
  group: pr-visuals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  visuals:
    name: PR visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/visuals@main
