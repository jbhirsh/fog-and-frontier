# Publishes each CI and Visual regression run's job reports to the
# repository's GitHub Pages once the run finishes: the test and visual jobs'
# last step (jbhirsh/ci's job-summary) writes each job's report, and its
# summary links to the page this puts it on. jbhirsh/ci's job-reports.yml
# says how; the site is the job-reports branch (Settings, Pages: Deploy from
# a branch, job-reports, / (root)). Not a pull-request workflow, so it's no
# check on a PR.
name: Job reports

on:
  workflow_run:
    workflows: [CI, Visual regression]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
