name: PR GIFs attach

# Attaches the GIFs a PR's PR GIFs run (pr-gif.yml, on pull_request)
# recorded: jbhirsh/ci's reusable pr-gif-attach.yml (its header says how).
# workflow_run always runs main's copy of this file, in a run of its own, so
# BOT_PR_TOKEN is never in a run holding the PR's code. It checks the run is
# a same-repository PR's, at the PR's current head, attaches what recorded,
# marks a failed scenario's earlier GIFs "Not updated", and drops the
# automatic GIFs of a scenario the PR no longer changes. A fork's PR is never
# attached: a "PR GIFs" commit status says so, and anyone who trusts it runs
# PR GIFs by hand. That status, pending then success or failure, is how its
# result shows on the PR. Not a pull-request workflow, so no required check
# or autofix trigger depends on it.
on:
  workflow_run:
    workflows: [PR GIFs]
    types: [completed]

permissions: {}

jobs:
  gif:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    uses: jbhirsh/ci/.github/workflows/pr-gif-attach.yml@main
    secrets:
      # A person's fine-grained token (Contents and Pull requests write):
      # GitHub refuses the Actions token for attachments.
      bot-token: ${{ secrets.BOT_PR_TOKEN }}
