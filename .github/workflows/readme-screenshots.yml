# README screenshots: after a change to the UI merges, retake the README's
# screenshots (docs/screenshots/) from a local production build reading
# production's catalog (scripts/readme-screenshots.ts) and, if any changed,
# open (or refresh) one PR from bot/readme-screenshots with them, set to
# merge itself once its checks pass. Not a PR gate, and main only: a run on
# any other branch would build the bot's PR from that branch.
#
# Every push to main runs it. It retakes the screenshots when the UI (the
# `readme-screenshots.shows` globs in .github/ci.json: src/ outside tests,
# index.html, public/, the capture scripts) changed since the last run that
# finished. Otherwise an open bot PR is brought up to date with main; when
# the UI changed but no screenshot did, an open bot PR is closed as stale.
# Deciding, comparing (over 0.5% of pixels changed) and the PR are
# jbhirsh/ci's readme-screenshots actions; taking them is this repo's.
#
# Two jobs, so the token that can push never meets npm: `capture` installs
# and builds with a read-only token and no stored credentials, and hands the
# changed PNGs on as an artifact; `publish` runs only git and gh, with
# BOT_PR_TOKEN (the publish action's `token` input says why it's needed and
# what it falls back to).
name: README screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

# The latest merge wins: an older run's screenshots are already out of date,
# and the next run covers its changes (it diffs from the last finished run).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Retake the screenshots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      capture: ${{ steps.decide.outputs.capture }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: decide
        uses: jbhirsh/ci/readme-screenshots/decide@main

      - uses: actions/setup-node@v7
        if: steps.decide.outputs.capture == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - if: steps.decide.outputs.capture == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.decide.outputs.capture == 'true'
        run: npx playwright install --with-deps chromium

      - name: Retake the screenshots
        if: steps.decide.outputs.capture == 'true'
        run: node --experimental-strip-types scripts/readme-screenshots.ts capture "$RUNNER_TEMP/shots"

      - id: compare
        if: steps.decide.outputs.capture == 'true'
        uses: jbhirsh/ci/readme-screenshots/compare@main
        with:
          fresh: ${{ runner.temp }}/shots

  publish:
    name: Open, refresh or close the PR
    needs: capture
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: jbhirsh/ci/readme-screenshots@main
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          capture: ${{ needs.capture.outputs.capture }}
          changed: ${{ needs.capture.outputs.changed }}
