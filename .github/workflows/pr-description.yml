name: PR description

# jbhirsh/ci's description check: the PR's description is in the shared shape
# (its headings, the goal's issue, the plan table, each change's commit, a
# Revisions table naming the head). It reads the PR's event as data and runs
# none of its code, so it needs no checkout and no token. A required check, so
# it has no `paths:` filter: a filtered-out workflow never reports. An edit
# supersedes the run before it, which is what makes the check follow the
# description a push's Revisions row rewrites.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/pr-template@main
