name: PR GIFs

# A PR's before/after GIFs, for motion its baselines can't show: jbhirsh/ci's
# reusable pr-gif.yml (its header says how) records each scenario against
# main and the PR's head, built for production and reading production's
# catalog and photos (scripts/gif-setup.ts).
#
# On every push to a PR into main (pull_request), it records the scenarios
# in scripts/gif-scenarios/ (gif.scenarios in .github/ci.json) that the PR's
# whole diff adds or changes, with no secret, and pr-gif-attach.yml attaches
# them to the PR's description from a run of its own. On a PR that changes
# no scenario, "Which scenarios changed" passes in seconds and nothing is
# recorded; there is no trigger-level paths filter.
#
# By hand (Actions, PR GIFs, Run workflow, or the Actions API), the
# fallback: the PR's number and any scenario files committed on its branch,
# side by side or after only; that run attaches its own GIFs. Only for a PR
# whose code you'd run. A scenario whose header asks for build variables of
# its own (VITE_APPLE_CLIENT_ID, say) can't get them here, either way:
# record it with `npm run gif` and drag its GIFs in, alt text `GIF: …`.
# Not a required check; exempt from autofix (.github/ci.json says why).
on:
  pull_request:
    # "Before" is main's, so only a PR into main.
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR's number
        required: true
        type: number
      scenarios:
        description: Paths from the repo's root, space-separated (scripts/gif-scenarios/<flow>.ts)
        required: true
        type: string
      side-by-side:
        description: One labelled GIF of before and after side by side
        type: boolean
        default: false
      after-only:
        description: Only "after", for a screen main doesn't have
        type: boolean
        default: false

permissions: {}

jobs:
  gif:
    permissions:
      contents: read
    uses: jbhirsh/ci/.github/workflows/pr-gif.yml@main
    with:
      # On pull_request the inputs are empty: the reusable workflow reads the
      # PR and its changed scenarios from the event.
      pr: ${{ inputs.pr || 0 }}
      scenarios: ${{ inputs.scenarios }}
      side-by-side: ${{ inputs.side-by-side == true }}
      after-only: ${{ inputs.after-only == true }}
    secrets:
      # A person's fine-grained token (Contents and Pull requests write):
      # GitHub refuses the Actions token for attachments. Never on
      # pull_request, whose run is the PR's code: pr-gif-attach.yml attaches
      # those.
      bot-token: ${{ github.event_name == 'workflow_dispatch' && secrets.BOT_PR_TOKEN || '' }}
