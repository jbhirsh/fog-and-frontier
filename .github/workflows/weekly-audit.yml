# Weekly audit: the checks that read the whole repository at once, too slow
# or too noisy to gate a PR, on the shared Monday 06:00 UTC sweep slot
# (Sunday night Pacific), plus manual dispatch. jbhirsh/ci's reusable
# workflow runs them, each with this repo's own config:
#
#   - Dead code (knip, knip.json): unused files, exports, types and
#     dependencies.
#   - Duplicated code (jscpd, .jscpd.json).
#   - Broken links (lychee) in the repo's Markdown: dead pages, missing
#     files and images, anchors no heading matches. The live catalog's links
#     are links.yml's.
#   - Architecture graph (dependency-cruiser): src/ and api/ (`audit.graph`
#     in .github/ci.json) drawn as an artifact. The layering rules themselves
#     gate every PR in ci.yml.
#
# Each finding keeps one issue, labelled weekly-audit: opened when the sweep
# finds something, its body replaced on the next, closed once a sweep comes
# back clean. The run stays green whatever it finds; it fails only when a
# tool itself breaks.
name: Weekly audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    uses: jbhirsh/ci/.github/workflows/audit.yml@main
    permissions:
      contents: read
      issues: write
