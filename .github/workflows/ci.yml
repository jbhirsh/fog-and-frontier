name: CI

# Lint, type-check and unit tests on every PR to main. smoke.yml/visual.yml
# only exercise the deployed preview, so without this job the Vitest suite,
# ESLint and tsc never gate a PR (they ran only transitively in Vercel's build).
on:
  pull_request:
    branches: [main]

env:
  # Run GitHub's bundled JavaScript actions (checkout, setup-node et al.) on the
  # Node 24 runtime instead of the deprecated default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default; the test job below widens its own scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # code-quality: write lets the coverage upload below reach GitHub.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Commit messages
        # Subject length, body, fixup and merge-commit rules from CLAUDE.md.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-commits.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # Cross-layer architecture rules: api/ ⇹ src/ isolation, src/lib may not
      # reach the UI, src/data stays a leaf. Complements eslint's import/no-cycle
      # (which only sees within each lint group).
      - name: Architecture rules (dependency-cruiser)
        run: npm run depcruise

      - name: Type-check
        run: npm run typecheck

      # The typed GraphQL operations in src/gql/ are generated from the SDL in
      # api/_schema.ts. Regenerate and fail if the checked-in output drifts, so
      # a schema change that wasn't re-codegen'd can't merge.
      - name: GraphQL codegen drift
        run: npm run codegen && git diff --exit-code src/gql/

      - name: Unit tests + coverage
        run: npm run test:coverage

      # GitHub-native coverage: the main ruleset's code coverage rule reads
      # this report (Code Quality must be enabled). The action credits it to
      # the PR's head commit and skips fork PRs on its own.
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # Until GitHub code coverage is available on the repo the upload
          # answers 404; keep that a warning so it can't turn CI red. The
          # coverage rule on main is the gate, and CI's own 80% per-file
          # threshold still fails the job above.
          fail-on-error: false

      # Catch build-only breakage (e.g. Vercel's cache-free tsc surfacing errors
      # a warm local build hides) before merge, not after deploy.
      - name: Build
        run: npx vite build

      # Hard cap on the app bundle. The build is not code-split, so the whole
      # client ships in a single dist/assets/index-*.js — currently ~816 KiB
      # (835,854 bytes). 1,050,000 leaves ~25% headroom for incremental growth
      # (new routes/components, a dep bump) without letting a size regression
      # slip in unnoticed. BSD stat first (local macOS), GNU stat fallback (CI).
      - name: Bundle size budget
        run: |
          main_size=$(stat -f%z dist/assets/index-*.js 2>/dev/null || stat -c%s dist/assets/index-*.js)
          max=1050000
          if [ "$main_size" -gt "$max" ]; then
            echo "::error::Main bundle exceeds budget: $main_size > $max bytes"
            exit 1
          fi
          echo "Bundle size OK: $main_size / $max bytes"

      # Fail the PR on known high/critical vulnerabilities in the code that
      # actually ships. Scoped to production deps and high+ severity — a
      # personal repo shouldn't block on moderate dev-dependency churn, which
      # Dependabot handles on its own cadence.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
