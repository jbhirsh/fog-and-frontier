name: Gemini eval

# Output-quality eval for the Gemini resolver (issue #122). Paid calls, so
# it runs only when asked: Actions → Gemini eval → Run workflow, on the
# branch to grade, with how much to grade:
#   - hikes:  the 7 hikes graded on their AllTrails link, no judge calls
#             (the cheapest: for the AllTrails search, parks, the trail picker's data)
#   - parks:  the 8 drafts graded on the park they're in (or none), no
#             judge calls
#   - drafts: every draft, no judge calls
#   - full:   every case, judged (for a change to Gemini's prompt or model)
# It used to run on pushes to ready PRs that touched the AI code, and hit
# the project's monthly spend cap. No schedule (paid calls). Skips green
# when the secret is unset. Each run's log ends with what it used.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: How much to grade
        type: choice
        default: hikes
        options: [hikes, parks, drafts, full]

concurrency:
  # A second run on the branch cancels one still grading.
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    # A full run: the 26 cases four at a time with a 120 s cap each (a
    # hike's AllTrails search, capped at 45 s, runs within its case's),
    # plus up to 19 judge calls with a 120 s cap each.
    timeout-minutes: 60
    permissions:
      contents: read
    # Secrets can't be referenced in `if:` conditions, so surface the key as a
    # job-level env var and gate the paid steps on a step output derived from it.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # For the hikes' AllTrails search; without it, drafts aren't searched.
      AGENT_SEARCH_API_KEY: ${{ secrets.AGENT_SEARCH_API_KEY }}
    steps:
      - name: Check for GEMINI_API_KEY
        id: key
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY not available (fork or secret unset) — skipping output-quality eval."
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Run output-quality eval
        if: steps.key.outputs.present == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            hikes) npm run eval -- --hikes --no-judge ;;
            parks) npm run eval -- --parks --no-judge ;;
            drafts) npm run eval -- --feature generateActivity --no-judge ;;
            full) npm run eval ;;
            *) echo "::error::unknown mode: $MODE"; exit 1 ;;
          esac

      - name: Upload eval results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_id }}
          path: eval/results.json
          retention-days: 14
