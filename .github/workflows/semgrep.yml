# Static application security testing (Semgrep). This repo ships an
# authenticated GraphQL API (`api/graphql.ts`) that takes user input, writes to
# libSQL, and calls out to Gemini — exactly the surface where an injection or a
# missing auth check hurts most. ESLint and `tsc` catch correctness, not
# security patterns; Semgrep fills that gap.
#
# jbhirsh/ci's semgrep action runs the free registry scan over the whole tree
# (no `semgrep.paths` in .github/ci.json) and fails on any finding; its
# scan.mjs holds the shared rule allowlist and why. Two placements:
#   - Pull requests: a blocking gate.
#   - Weekly schedule (+ manual dispatch): a drift sensor on the shared Monday
#     06:00 UTC sweep slot, catching findings from rule updates or dependency
#     changes that a quiet PR week wouldn't surface.
name: Semgrep

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: jbhirsh/ci/semgrep@main
