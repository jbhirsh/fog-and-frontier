name: Claude Auto-Fix PR Comments

# Fixes Dependabot's PRs: a failed check's mechanical breakage, then the
# review threads Claude Review or the owner left. jbhirsh/ci's autofix
# action does it (autofix/action.yml there says how); this repo's part is
# the trigger below and "autofix" in .github/ci.json (the commands a fix
# must pass), read from main.
on:
  workflow_run:
    # Must match each workflow's `name:`. Claude Review (claude-review.yml)
    # leaves the review threads; any listed workflow's completion can start
    # the review fixer once CI and Claude Review are both green on the head.
    # When one of these fails on a Dependabot PR, the CI fixer takes it.
    # Every pull-request workflow belongs here unless "autofix.exempt" in
    # .github/ci.json says why not: the CI fixer acts once no pull-request
    # run on the head is still going, so the last to finish must wake it.
    # CI's "Autofix triggers" step (jbhirsh/ci's autofix/check-triggers)
    # fails a PR that leaves one out or names a workflow that doesn't exist.
    workflows:
      ["CI", "Claude Review", "Smoke gate", "Visual regression", "Mutation", "Gitleaks", "Semgrep"]
    types: [completed]

concurrency:
  group: claude-autofix-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  # Several workflows finish per push. Queue rather than cancel, so one
  # finishing can't kill a fix mid-push; a run for an older head skips
  # itself.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autofix:
    name: Auto-Fix Unresolved Review Comments
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # claude-code-action exchanges an OIDC token for the Claude GitHub
      # App's token before it starts; without this every run that has work
      # to do fails with "Could not fetch an OIDC token".
      id-token: write
    steps:
      - uses: jbhirsh/ci/autofix@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
