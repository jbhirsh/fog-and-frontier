name: Visual regression

# The pages' screenshots (see the projects in playwright.config.ts), taken
# for visual review (jbhirsh/ci#64): in take mode (VISUAL_SHOTS) they're
# written, never compared, into the git-ignored tests/visual/shots/, and
# jbhirsh/ci's visual-shots uploads them. visual-review.yml compares a PR's
# with main's of the commit it's built on, so every push to main runs here
# too and is never cancelled. A visual difference never fails this job; a
# page that breaks (a missing element, a timeout, an error) still does.
#
# Run by hand on main with mockup_patch and mockup_issue, it's a mockup: a
# plan's throwaway patch (git diff --binary | base64 -w0) applied by
# jbhirsh/ci's visual-shots/mockup, only to the paths
# `visual-review.mockupPaths` in .github/ci.json allows, and its screenshots
# go to visual review's table on that issue. The patch is code on no branch,
# so a mockup run holds no secret, writes no cache, runs in a concurrency
# group of its own, and skips everything but the screenshots. Its inputs
# reach the actions as inputs, never spliced into a script, and which steps
# run is decided from the inputs, never an env value the patch could set.
# Those limits hold for this file's steps only: the patch's own code (the
# app's src/ and the specs in tests/visual/) runs as Node on the runner,
# with the runner's powers, so dispatch only a patch you'd commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mockup_patch:
        description: A mockup's patch, base64 (git diff --binary | base64 -w0); empty for a plain run
        type: string
        default: ""
      mockup_issue:
        description: The issue the mockup's table goes on
        type: string
        default: ""

# A PR's newer push cancels its older run. Every other run, a push to main
# above all (a cancelled one leaves its commit without shots for PRs to be
# compared with) and a mockup, is a group of its own, never cancelled or
# replaced while queued.
concurrency:
  group: visual-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    # actions: read lets the job summary read the run's steps and earlier runs.
    permissions:
      contents: read
      actions: read
    steps:
      # The job summary's report charts the machine's CPU across the job:
      # first, so the chart covers every step (jbhirsh/ci's sample-load).
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
        uses: jbhirsh/ci/job-summary/sample-load@main

      # Depth 2: visual-shots reads a PR's merge commit's parents, the PR's
      # head and main's.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # An issue with no patch would be a plain run whose table goes nowhere.
      # A patch off main or with no issue, visual-shots/mockup refuses.
      - name: Refuse a mockup issue with no patch
        if: github.event_name == 'workflow_dispatch' && inputs.mockup_patch == '' && inputs.mockup_issue != ''
        run: |
          echo "::error::mockup_issue needs mockup_patch, the change to screenshot."
          exit 1

      - name: Apply the mockup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '' }}
        uses: jbhirsh/ci/visual-shots/mockup@main
        with:
          patch: ${{ inputs.mockup_patch }}
          issue: ${{ inputs.mockup_issue }}

      # No npm cache for a mockup: one written after its patch ran could
      # reach every later run.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') && 'npm' || '' }}
          package-manager-cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        # WebKit only, for the iPhone and Desktop Safari (#330): see the
        # projects in playwright.config.ts.
        run: npx playwright install --with-deps webkit

      # What a slow or flaky run's report is worth seeing beside its tests:
      # the Playwright release and the browsers it drove, with their
      # versions (a dry run prints them, without installing anything). Never
      # fails the job: a missing note only leaves the report without it.
      - name: Read the Playwright and browser versions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
        id: playwright
        continue-on-error: true
        run: |
          echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
          echo "browsers=$(npx playwright install --dry-run webkit | awk '/^[^ ]/ && !/^FFmpeg/ { sub(/ \(playwright.*/, ""); printf "%s%s", sep, $0; sep = ", " }')" >> "$GITHUB_OUTPUT"

      # Shown in the report's Environment, with the machine the first note
      # adds (jbhirsh/ci's job-summary/note).
      - name: Note them for the job summary
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
        uses: jbhirsh/ci/job-summary/note@main
        with:
          notes: |
            Playwright: ${{ steps.playwright.outputs.version }}
            Browsers: ${{ steps.playwright.outputs.browsers }}

      # Detect Linux baselines anywhere under tests/visual. `compgen -G "**/*.png"`
      # does NOT recurse into subdirectories unless `shopt -s globstar` is set,
      # so it silently returned "no baselines" for files inside
      # `pages.spec.ts-snapshots/`. `find` walks the tree explicitly and is
      # unambiguous: exits 0 with output iff at least one match exists.
      - name: Check for existing Linux baselines
        id: baselines
        working-directory: tests/visual
        run: |
          if find . -name '*-linux.png' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # This job never writes baselines: if there are none, it fails with
      # where they come from instead of passing with nothing compared.
      - name: Fail if baselines missing
        if: steps.baselines.outputs.present != 'true'
        run: |
          echo "::error::No Linux baseline screenshots found under tests/visual/."
          echo "::error::Make them by running visual-baselines.yml on this branch: Actions tab -> Update visual baselines -> Run workflow."
          exit 1

      # Take mode: every screenshot is written afresh, so none fails on a
      # difference; any other failure still fails the test.
      - name: Take the screenshots
        env:
          VISUAL_SHOTS: "1"
        run: npm run test:visual -- --update-snapshots=all

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      # The job's summary and report (jbhirsh/ci's job-summary): its steps
      # and screenshot tests (each named with its Playwright project, desktop
      # or mobile) beside its recent runs, published
      # on the repository's Pages by the reports job below.
      - name: Job summary
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
        uses: jbhirsh/ci/job-summary@main
        with:
          job: visual
          junit: test-results/junit.xml

      # Last, and only once every page rendered: a failed run uploads no
      # shots, and visual review reports the job's failure instead.
      - uses: jbhirsh/ci/visual-shots@main
        with:
          mockup-issue: ${{ github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '' && inputs.mockup_issue || '' }}

  # Publishes this run's job reports to the repository's Pages and keeps
  # one comment on the PR with every job's summary (jbhirsh/ci's
  # job-reports.yml), once the visual job is done, failed or not. As part of
  # the run, it runs from the PR's own branch. Not a required check; it
  # never fails a run for a report.
  reports:
    needs: [visual]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.mockup_patch != '') }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
