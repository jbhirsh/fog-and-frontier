name: Visual regression

# The pages' screenshots, compared with their Linux baselines (see the
# projects in playwright.config.ts). visual-baselines.yml, run by hand,
# rewrites those baselines and commits them to its branch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        # Chromium (desktop), WebKit (the iPhone and desktop Safari) and
        # Firefox (desktop): see the projects in playwright.config.ts.
        run: npx playwright install --with-deps chromium webkit firefox

      # Detect Linux baselines anywhere under tests/visual. `compgen -G "**/*.png"`
      # does NOT recurse into subdirectories unless `shopt -s globstar` is set,
      # so it silently returned "no baselines" for files inside
      # `pages.spec.ts-snapshots/`. `find` walks the tree explicitly and is
      # unambiguous: exits 0 with output iff at least one match exists.
      - name: Check for existing Linux baselines
        id: baselines
        working-directory: tests/visual
        run: |
          if find . -name '*-linux.png' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # This job never writes baselines: if there are none, it fails with
      # where they come from instead of passing with nothing compared.
      - name: Fail if baselines missing
        if: steps.baselines.outputs.present != 'true'
        run: |
          echo "::error::No Linux baseline screenshots found under tests/visual/."
          echo "::error::Make them by running visual-baselines.yml on this branch: Actions tab -> Update visual baselines -> Run workflow."
          exit 1

      - name: Run visual tests
        run: npm run test:visual

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
