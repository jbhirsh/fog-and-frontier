name: Visual regression

# The pages' screenshots, compared with their Linux baselines (see the
# projects in playwright.config.ts). visual-baselines.yml, run by hand,
# rewrites those baselines and commits them to its branch. It also runs on
# every push to main, so the job's report (jbhirsh/ci's job-summary) has
# main's runs to compare a PR's with; nothing in it reads a pull request or
# writes anything back, and with no concurrency group a push to main never
# cancels a PR's run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    # actions: read lets the job summary read the run's steps and earlier runs.
    permissions:
      contents: read
      actions: read
    steps:
      # The job summary's report charts the machine's CPU across the job:
      # first, so the chart covers every step (jbhirsh/ci's sample-load).
      - uses: jbhirsh/ci/job-summary/sample-load@main

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        # Chromium (desktop), WebKit (the iPhone and desktop Safari) and
        # Firefox (desktop): see the projects in playwright.config.ts.
        run: npx playwright install --with-deps chromium webkit firefox

      # What a slow or flaky run's report is worth seeing beside its tests:
      # the Playwright release and the browsers it drove, with their
      # versions (a dry run prints them, without installing anything). Never
      # fails the job: a missing note only leaves the report without it.
      - name: Read the Playwright and browser versions
        id: playwright
        continue-on-error: true
        run: |
          echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
          echo "browsers=$(npx playwright install --dry-run chromium webkit firefox | awk '/^[^ ]/ && !/^FFmpeg/ { sub(/ \(playwright.*/, ""); printf "%s%s", sep, $0; sep = ", " }')" >> "$GITHUB_OUTPUT"

      # Shown in the report's Environment, with the machine the first note
      # adds (jbhirsh/ci's job-summary/note).
      - name: Note them for the job summary
        uses: jbhirsh/ci/job-summary/note@main
        with:
          notes: |
            Playwright: ${{ steps.playwright.outputs.version }}
            Browsers: ${{ steps.playwright.outputs.browsers }}

      # Detect Linux baselines anywhere under tests/visual. `compgen -G "**/*.png"`
      # does NOT recurse into subdirectories unless `shopt -s globstar` is set,
      # so it silently returned "no baselines" for files inside
      # `pages.spec.ts-snapshots/`. `find` walks the tree explicitly and is
      # unambiguous: exits 0 with output iff at least one match exists.
      - name: Check for existing Linux baselines
        id: baselines
        working-directory: tests/visual
        run: |
          if find . -name '*-linux.png' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # This job never writes baselines: if there are none, it fails with
      # where they come from instead of passing with nothing compared.
      - name: Fail if baselines missing
        if: steps.baselines.outputs.present != 'true'
        run: |
          echo "::error::No Linux baseline screenshots found under tests/visual/."
          echo "::error::Make them by running visual-baselines.yml on this branch: Actions tab -> Update visual baselines -> Run workflow."
          exit 1

      - name: Run visual tests
        run: npm run test:visual

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      # The job's summary and report (jbhirsh/ci's job-summary): its steps
      # and screenshot tests (each named with its Playwright project, as the
      # desktop pages run in three engines) beside its recent runs, published
      # on the repository's Pages by the reports job below.
      - name: Job summary
        if: ${{ !cancelled() }}
        uses: jbhirsh/ci/job-summary@main
        with:
          job: visual
          junit: test-results/junit.xml

  # Publishes this run's job reports to the repository's Pages and keeps
  # one comment on the PR with every job's summary (jbhirsh/ci's
  # job-reports.yml), once the visual job is done, failed or not. As part of
  # the run, it runs from the PR's own branch. Not a required check; it
  # never fails a run for a report.
  reports:
    needs: [visual]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
