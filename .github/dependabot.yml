# Dependency update automation. Prior to this the repo had no Dependabot /
# Renovate and no `npm audit` gate, so advisories (e.g. the undici HIGH
# advisories pulled in transitively via @vercel/node) sat unsurfaced. Weekly
# npm + github-actions checks.
#
# Each ecosystem gets one PR per run for everything, majors included, and one
# for every security fix found at once, instead of a PR per package. That also
# keeps packages that must move in lockstep together. The cost: a major that
# needs code changes holds the whole bundle until it's fixed.
#
# Both ecosystems run on the shared Monday 06:00 UTC weekly sweep slot so all
# robot output lands together on Monday morning. Security updates don't wait
# for it: they open as soon as an alert does.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      # Majors that wait on another package, one group per package: each gets
      # a PR of its own, red until that package catches up, then green, and
      # auto-merge takes it, without waiting on another blocked major or
      # holding the bumps in all-updates. (Dependabot puts an update in the
      # first group that matches; these packages' minors and patches go on
      # to all-updates.) Autofix leaves their red checks alone: jbhirsh/ci's
      # autofix/action.yml passes over a branch matching
      # dependabot/*/blocked-*, so keep the blocked- prefix.
      #
      # graphql 17: @apollo/server 5.5.1 (and its @apollo/* deps) still takes
      # only graphql 16 (peer "^16.11.0"), so `npm ci` fails ERESOLVE with
      # graphql@17.0.2.
      blocked-graphql:
        update-types: ["major"]
        patterns: [graphql]
      # TypeScript 7 (the native compiler) exports no compiler API, which the
      # lint and type-coverage gates load: ESLint stops on "typescript-eslint
      # does not support TS 7.0" (8.72's peer range is <6.1.0) and
      # type-coverage 2.30 on "needs the TypeScript compiler API
      # (ts.createProgram)".
      blocked-typescript:
        update-types: ["major"]
        patterns: [typescript]
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
