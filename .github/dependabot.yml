# Dependency update automation. Prior to this the repo had no Dependabot /
# Renovate and no `npm audit` gate, so advisories (e.g. the undici HIGH
# advisories pulled in transitively via @vercel/node) sat unsurfaced. Weekly
# npm + github-actions checks.
#
# Each ecosystem gets one PR per run for everything, majors included, and one
# for every security fix found at once, instead of a PR per package. That also
# keeps packages that must move in lockstep together. The cost: a major that
# needs code changes holds the whole bundle until it's fixed.
#
# Both ecosystems run on the shared Monday 06:00 UTC weekly sweep slot so all
# robot output lands together on Monday morning. Security updates don't wait
# for it: they open as soon as an alert does.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # Each ignore is majors only: minors and patches still flow. Without one,
    # the grouped PR would keep offering a major that fails, holding every
    # other bump with it.
    ignore:
      # graphql 17: @apollo/server 5.5.1 (and its @apollo/cache-control-types,
      # server-gateway-interface and utils.* deps) still takes only graphql 16
      # (peer "^16.11.0"), so with graphql@17.0.2 `npm ci` fails "ERESOLVE
      # could not resolve ... peer graphql@"^16.11.0" from
      # @apollo/server@5.5.1". Delete once Apollo Server accepts 17.
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) exports no compiler API, which the
      # lint and type-coverage gates load: with typescript@7.0.2, ESLint stops
      # on "typescript-eslint does not support TS 7.0" (8.72's peer range is
      # <6.1.0) and type-coverage 2.30 on "needs the TypeScript compiler API
      # (ts.createProgram), which typescript@7.0.2 does not export" (tsc -b,
      # vite, vitest and codegen pass). Delete once typescript-eslint accepts
      # TS 7, or run TS 7 beside the 6 API as sift and BoardGames do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
