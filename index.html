<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Home-screen install (#52): Android reads the manifest; iOS reads the
         apple-* tags. theme-color matches the header's bg-surface. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f9fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fog &amp; Frontier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fog and Frontier — Adventures along the West Coast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Google's Material Symbols stylesheet sets its own unlayered
         .material-symbols-outlined { font-size: 24px; … }, which would
         outrank every Tailwind utility (all layered), so a sized icon
         (text-icon-sm…) rendered at 24px anyway. Imported here into its own
         layer, named before the app's stylesheet (which Vite adds after
         this) names Tailwind's, it ranks below all of them. It isn't in
         src/index.css: an @import there goes ahead of Tailwind's license
         banner, and the minifier drops a banner that isn't first. -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap')
      layer(icon-font);
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
